name: Technique or control review
description: The model teaches something wrong or oversimplified
labels: [engine, review]
body:
  - type: input
    id: item
    attributes:
      label: Technique or control
      placeholder: remote-login, mfa, segmentation...
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong, and what would be more accurate?
      description: References (MITRE ATT&CK, D3FEND, documentation) are welcome. Please do not include exploitation procedures.
    validations:
      required: true
